spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  jackson:
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

sms:
  provider: msg91
  auth:
    key: YOUR_MSG91_AUTH_KEY
  template:
    id: YOUR_TEMPLATE_ID
  sender: CSDAPP